# Installed as .github/workflows/ctx-notarize.yml in jasonzh0/CineScreen,
# which already holds Bicycle's Apple notarization credentials.
name: Notarize bicycle
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string
      sha256:
        description: SHA-256 of the signed candidate ZIP
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: bicycle-notarization
  cancel-in-progress: false
jobs:
  notarize:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      CANDIDATE_SHA256: ${{ inputs.sha256 }}
    steps:
      - name: Download and verify the signed universal candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://bicycle-releases.jasonzhang-develop.workers.dev/bicycle-macos-$RELEASE_VERSION-candidate.zip" -o candidate.zip
          printf '%s  candidate.zip\n' "$CANDIDATE_SHA256" | shasum -a 256 --check
          ditto -x -k candidate.zip build
          APP=build/Bicycle.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Contents/Info.plist")" = com.bicycle.desktop
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$RELEASE_VERSION"
          codesign --verify --deep --strict "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -Fx 'TeamIdentifier=JAT3GYBPJ4'
          for BINARY in Contents/MacOS/Bicycle Contents/Resources/bin/bicycle Contents/Resources/bin/BicycleCredentialHelper; do
            lipo "$APP/$BINARY" -verify_arch x86_64 arm64
          done
      - name: Notarize, staple, and verify
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test "$APPLE_TEAM_ID" = JAT3GYBPJ4
          xcrun notarytool submit candidate.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait --timeout 15m --output-format json > notarization.json
          cat notarization.json
          python3 -c 'import json; r=json.load(open("notarization.json")); assert r["status"] == "Accepted", r'
          xcrun stapler staple build/Bicycle.app
          xcrun stapler validate build/Bicycle.app
          codesign --verify --deep --strict build/Bicycle.app
          spctl --assess --type execute --verbose=2 build/Bicycle.app
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent build/Bicycle.app "release/bicycle-macos-$RELEASE_VERSION.zip"
          shasum -a 256 "release/bicycle-macos-$RELEASE_VERSION.zip" > release/SHA256SUMS
          cp notarization.json release/
      - uses: actions/upload-artifact@v4
        with:
          name: bicycle-macos-notarized
          path: release/*
          retention-days: 7
          if-no-files-found: error
